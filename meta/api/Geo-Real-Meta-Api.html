import express from 'express';
const app = express();
app.use(express.json());
app.use((_,res,next)=>{res.setHeader('Access-Control-Allow-Origin','*');res.setHeader('Access-Control-Allow-Headers','Content-Type');res.setHeader('Access-Control-Allow-Methods','POST,OPTIONS');next();});
app.options('/api/ai-edit', (_,res)=>res.sendStatus(200));

app.post('/api/ai-edit', async (req,res)=>{
  if(req.body.test) return res.json({ok:true, mock:'pong'});
  const {prompt,h2,h3,body,bullets,layout,context} = req.body;
  const r = await fetch('https://api.llama-api.com/chat/completions',{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'Authorization': \`Bearer \${process.env.META_LLAMA_API_KEY}\`
    },
    body: JSON.stringify({
      model:'llama-3.1-70b',
      messages:[
        {role:'system', content:'You are a GEO content editor. Return JSON only: {h2,h3,body,bullets,layout,gridCols,align}. Keep brand tone.'},
        {role:'user', content: \`Context: \${JSON.stringify(context)}\\nCurrent h2:\${h2}\\nbody:\${body}\\nInstruction:\${prompt}\`}
      ]
    })
  });
  const data = await r.json();
  let txt = data.choices?.[0]?.message?.content || '{}';
  // strip markdown fences
  txt = txt.replace(/\\\`\\\`\\\`json|\\\`\\\`\\\`/g,'').trim();
  const parsed = JSON.parse(txt);
