<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>솔라루프 관리자 PRO</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  .status-신규{ background:#fef3c7; color:#92400e; border:1px solid #fcd34d }
  .status-연락완료{ background:#dbeafe; color:#1e40af; border:1px solid #93c5fd }
  .status-상담중{ background:#ffedd5; color:#9a3412; border:1px solid #fed7aa }
  .status-현장방문{ background:#e0e7ff; color:#4338ca; border:1px solid #c7d2fe }
  .status-견적발송{ background:#f3e8ff; color:#6b21a8; border:1px solid #d8b4fe }
  .status-계약진행{ background:#ddd6fe; color:#5b21b6; border:1px solid #c4b5fd }
  .status-완료{ background:#dcfce7; color:#166534; border:1px solid #86efac }
  .status-보류{ background:#f1f5f9; color:#475569; border:1px solid #cbd5e1 }
  .status-취소{ background:#fee2e2; color:#991b1b; border:1px solid #fca5a5 }
  .drawer { transform: translateX(100%); transition: transform .3s cubic-bezier(.4,0,.2,1) }
  .drawer.open { transform: translateX(0) }
  .tab-active { background:#0F4C81; color:white }
</style>
</head>
<body class="bg-[#f5f7fb] min-h-screen text-[13px]">
<!-- Login -->
<div id="login-screen" class="fixed inset-0 bg-slate-900/95 z-[100] flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl p-8 w-full max-w-sm shadow-2xl">
    <h1 class="text-xl font-black text-[#0F4C81] mb-1">솔라루프 관리자 PRO</h1>
    <p class="text-[12px] text-slate-500 mb-6">문의·한전·상담 통합관리</p>
    <input id="pw-input" type="password" placeholder="비밀번호 7270" class="w-full h-12 rounded-xl border border-slate-200 px-4 mb-3 focus:border-[#0F4C81] outline-none" onkeydown="if(event.key==='Enter')login()">
    <button onclick="login()" class="w-full h-12 bg-[#0F4C81] text-white rounded-xl font-bold">로그인</button>
    <div id="login-error" class="text-red-500 text-[12px] mt-2 hidden">비밀번호가 틀렸습니다</div>
  </div>
</div>

<header class="bg-white border-b sticky top-0 z-40">
  <div class="max-w-[1600px] mx-auto px-4 h-14 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 bg-[#0F4C81] rounded-lg flex items-center justify-center text-white font-black">S</div>
      <span class="font-black text-[15px]">솔라루프 관리자 PRO</span>
      <span class="text-[10px] bg-amber-100 text-amber-800 px-2 py-1 rounded-full font-bold">문의 11항목 + 한전연계</span>
    </div>
    <div class="flex gap-2">
      <a href="/" target="_blank" class="px-3 py-1.5 border rounded-lg text-[12px]"><i class="fa-solid fa-arrow-up-right-from-square"></i> 사이트</a>
      <button onclick="exportCSV()" class="px-3 py-1.5 bg-emerald-600 text-white rounded-lg text-[12px]"><i class="fa-solid fa-file-excel"></i> 엑셀</button>
      <button onclick="loadData()" class="px-3 py-1.5 bg-slate-900 text-white rounded-lg text-[12px]"><i class="fa-solid fa-rotate"></i> 새로고침</button>
      <button onclick="logout()" class="px-3 py-1.5 border rounded-lg text-[12px]">로그아웃</button>
    </div>
  </div>
</header>

<div class="max-w-[1600px] mx-auto px-4 py-5">
  <!-- Stats -->
  <div class="grid grid-cols-3 md:grid-cols-7 gap-3 mb-5">
    <div class="bg-white rounded-xl p-3 border"><div class="text-[10px] text-slate-500">전체</div><div id="stat-total" class="text-xl font-black">0</div></div>
    <div class="bg-white rounded-xl p-3 border"><div class="text-[10px] text-slate-500">오늘</div><div id="stat-today" class="text-xl font-black text-[#0F4C81]">0</div></div>
    <div class="bg-white rounded-xl p-3 border"><div class="text-[10px] text-slate-500">신규</div><div id="stat-new" class="text-xl font-black text-amber-600">0</div></div>
    <div class="bg-white rounded-xl p-3 border"><div class="text-[10px] text-slate-500">연락완료</div><div id="stat-contacted" class="text-xl font-black text-blue-600">0</div></div>
    <div class="bg-white rounded-xl p-3 border"><div class="text-[10px] text-slate-500">계약진행</div><div id="stat-progress" class="text-xl font-black text-violet-600">0</div></div>
    <div class="bg-white rounded-xl p-3 border"><div class="text-[10px] text-slate-500">완료</div><div id="stat-done" class="text-xl font-black text-emerald-600">0</div></div>
    <div class="bg-white rounded-xl p-3 border"><div class="text-[10px] text-slate-500">메일실패</div><div id="stat-mailfail" class="text-xl font-black text-red-600">0</div></div>
  </div>

  <!-- Filters -->
  <div class="bg-white rounded-xl border p-3 mb-4 flex flex-wrap gap-2 items-center">
    <select id="filter-status" onchange="render()" class="h-9 border rounded-lg px-3 text-[12px]"><option value="">전체상태</option><option>신규</option><option>연락완료</option><option>상담중</option><option>현장방문</option><option>견적발송</option><option>계약진행</option><option>완료</option><option>보류</option><option>취소</option></select>
    <select id="filter-roof" onchange="render()" class="h-9 border rounded-lg px-3 text-[12px]"><option value="">전체지붕</option><option>샌드위치판</option><option>기와</option><option>슬레이트</option><option>기타</option></select>
    <select id="filter-date" onchange="render()" class="h-9 border rounded-lg px-3 text-[12px]"><option value="">전체기간</option><option value="today">오늘</option><option value="week">7일</option><option value="month">30일</option></select>
    <input id="filter-search" oninput="render()" placeholder="이름/전화/주소/메시지 검색" class="h-9 border rounded-lg px-3 text-[12px] w-[260px]">
    <span id="last-updated" class="text-[10px] text-slate-400 ml-auto"></span>
  </div>

  <!-- Table -->
  <div class="bg-white rounded-xl border overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-[12px]">
        <thead class="bg-slate-50 text-[11px] text-slate-500 border-b"><tr>
          <th class="p-3 text-left">접수/평수/지붕</th><th class="p-3 text-left">고객/연락처</th><th class="p-3 text-left">주소/페이지</th><th class="p-3 text-left">상태/메일</th><th class="p-3 text-left">상담요약</th><th class="p-3 text-left">액션</th>
        </tr></thead>
        <tbody id="table-body"><tr><td colspan="6" class="p-10 text-center text-slate-400">불러오는 중...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Detail Drawer -->
<div id="drawer-backdrop" onclick="closeDetail()" class="fixed inset-0 bg-black/30 z-50 hidden"></div>
<div id="detail-drawer" class="drawer fixed top-0 right-0 w-full max-w-[560px] h-full bg-white z-50 shadow-2xl overflow-y-auto">
  <div class="sticky top-0 bg-white border-b p-4 flex items-center justify-between">
    <h2 class="font-black text-[15px]">문의 상세</h2>
    <button onclick="closeDetail()" class="w-8 h-8 rounded-lg bg-slate-100"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <div id="drawer-content" class="p-4 space-y-5"></div>
</div>

<script>
const PASSWORD='7270';
let inquiries=[]; let selectedId=null;
const metroMap=[{k:'서울',c:'11'},{k:'부산',c:'26'},{k:'대구',c:'27'},{k:'인천',c:'28'},{k:'광주',c:'29'},{k:'대전',c:'30'},{k:'울산',c:'31'},{k:'세종',c:'36'},{k:'경기',c:'41'},{k:'강원',c:'42'},{k:'충북',c:'43'},{k:'충남',c:'44'},{k:'전북',c:'45'},{k:'전남',c:'46'},{k:'경북',c:'47'},{k:'경남',c:'48'},{k:'제주',c:'50'}];
function guessMetro(addr){ for(let m of metroMap){ if(addr.includes(m.k)) return m.c } return '41'; }
function login(){ if(document.getElementById('pw-input').value===PASSWORD){ sessionStorage.setItem('admin_auth','true'); document.getElementById('login-screen').style.display='none'; loadData(); } else document.getElementById('login-error').classList.remove('hidden'); }
function logout(){ sessionStorage.removeItem('admin_auth'); location.reload(); }
if(sessionStorage.getItem('admin_auth')==='true'){ document.getElementById('login-screen').style.display='none'; }
window.addEventListener('DOMContentLoaded', ()=>{ if(sessionStorage.getItem('admin_auth')==='true') loadData(); });

async function loadData(){
  try{
    const res=await fetch('/api/inquiries'); const json=await res.json(); inquiries=json.inquiries||[];
    document.getElementById('last-updated').innerText='업데이트: '+new Date().toLocaleString('ko-KR');
    render();
  }catch(e){ document.getElementById('table-body').innerHTML=`<tr><td colspan=6 class="p-8 text-center text-red-500">오류: ${e.message}</td></tr>`; }
}
function render(){
  const statusF=document.getElementById('filter-status').value;
  const roofF=document.getElementById('filter-roof').value;
  const dateF=document.getElementById('filter-date').value;
  const search=document.getElementById('filter-search').value.toLowerCase();
  let filtered=inquiries.filter(i=>{
    if(statusF && i.status!==statusF) return false;
    if(roofF && !(i.roofType||'').includes(roofF)) return false;
    if(search && !(`${i.name} ${i.phone} ${i.address} ${i.message} ${i.pyeong}`.toLowerCase().includes(search))) return false;
    if(dateF){
      const d=new Date(i.createdAt||i.receivedAt); const now=new Date();
      if(dateF==='today' && d.toDateString()!==now.toDateString()) return false;
      if(dateF==='week' && (now-d)/86400000>7) return false;
      if(dateF==='month' && (now-d)/86400000>30) return false;
    }
    return true;
  });
  // stats
  const today=new Date().toISOString().slice(0,10);
  document.getElementById('stat-total').innerText=inquiries.length;
  document.getElementById('stat-today').innerText=inquiries.filter(i=>(i.createdAt||'').slice(0,10)===today).length;
  document.getElementById('stat-new').innerText=inquiries.filter(i=>i.status==='신규').length;
  document.getElementById('stat-contacted').innerText=inquiries.filter(i=>i.status==='연락완료').length;
  document.getElementById('stat-progress').innerText=inquiries.filter(i=>i.status==='계약진행').length;
  document.getElementById('stat-done').innerText=inquiries.filter(i=>i.status==='완료').length;
  document.getElementById('stat-mailfail').innerText=inquiries.filter(i=>!i.emailSent).length;

  const tbody=document.getElementById('table-body');
  if(filtered.length===0){ tbody.innerHTML='<tr><td colspan=6 class="p-10 text-center text-slate-400">문의가 없습니다</td></tr>'; return; }
  tbody.innerHTML=filtered.map(item=>`
    <tr class="border-t hover:bg-slate-50 cursor-pointer" onclick="openDetail('${item.id}')">
      <td class="p-3 align-top"><div class="font-bold text-[11px]">${(item.receivedAt||'').slice(0,16)}</div><div class="text-[11px]">${item.pyeong}평 / ${item.roofType}</div><div class="text-[10px] text-slate-400">${item.id.slice(0,12)}</div></td>
      <td class="p-3 align-top"><div class="font-bold">${item.name}</div><div class="text-[#0F4C81] font-bold">${item.phone}</div></td>
      <td class="p-3 align-top"><div class="truncate max-w-[200px]">${item.address}</div><div class="text-[10px] text-slate-400 truncate max-w-[200px]">${item.pageUrl||''}</div></td>
      <td class="p-3 align-top"><span class="px-2 py-1 rounded-full text-[11px] font-bold status-${item.status}">${item.status}</span><div class="mt-1 text-[10px] ${item.emailSent?'text-emerald-600':'text-red-500'}">${item.emailSent?'메일OK':'메일실패'}</div></td>
      <td class="p-3 align-top max-w-[180px] truncate text-[11px] text-slate-600">${(item.memo||'').slice(0,40)} ${(item.kakaoMemo||'').slice(0,20)}</td>
      <td class="p-3 align-top"><button onclick="event.stopPropagation(); openDetail('${item.id}')" class="px-2 py-1 bg-slate-900 text-white rounded text-[11px]">상세</button></td>
    </tr>`).join('');
}

function openDetail(id){
  const item=inquiries.find(i=>i.id===id); if(!item) return; selectedId=id;
  document.getElementById('drawer-backdrop').classList.remove('hidden');
  document.getElementById('detail-drawer').classList.add('open');
  document.getElementById('drawer-content').innerHTML=`
    <!-- 고객정보 -->
    <div class="bg-slate-50 rounded-xl p-4 border">
      <h3 class="font-black mb-3 flex items-center gap-2"><i class="fa-solid fa-user"></i> 고객 문의 원본 11항목</h3>
      <div class="grid grid-cols-2 gap-3 text-[12px]">
        <div><div class="text-[10px] text-slate-500">이름</div><div class="font-bold">${item.name} <button onclick="copyText('${item.name}')" class="ml-1 text-[10px] text-blue-600">복사</button></div></div>
        <div><div class="text-[10px] text-slate-500">전화</div><div class="font-bold"><a href="tel:${item.phone}" class="text-[#0F4C81] underline">${item.phone}</a> <button onclick="copyText('${item.phone}')" class="ml-1 text-[10px] text-blue-600">복사</button> <a href="sms:${item.phone}" class="ml-1 text-[10px] bg-slate-900 text-white px-1.5 py-0.5 rounded">문자</a></div></div>
        <div class="col-span-2"><div class="text-[10px] text-slate-500">주소</div><div class="font-bold">${item.address} <button onclick="copyText('${item.address}')" class="text-[10px] text-blue-600 ml-1">복사</button> <a href="https://map.kakao.com/?q=${encodeURIComponent(item.address)}" target="_blank" class="text-[10px] bg-yellow-400 px-1.5 py-0.5 rounded ml-1">카카오지도</a> <a href="https://map.naver.com/v5/search/${encodeURIComponent(item.address)}" target="_blank" class="text-[10px] bg-green-600 text-white px-1.5 py-0.5 rounded ml-1">네이버지도</a></div></div>
        <div><div class="text-[10px] text-slate-500">평수</div><div class="font-bold">${item.pyeong}평</div></div>
        <div><div class="text-[10px] text-slate-500">지붕형태</div><div class="font-bold">${item.roofType}</div></div>
        <div class="col-span-2"><div class="text-[10px] text-slate-500">문의메시지</div><div class="bg-white border rounded-lg p-2 mt-1 whitespace-pre-wrap">${item.message||'없음'}</div></div>
        <div><div class="text-[10px] text-slate-500">접수일시</div><div>${item.receivedAt||''}<br><span class="text-[10px] text-slate-400">${item.createdAt||''}</span></div></div>
        <div><div class="text-[10px] text-slate-500">유입페이지</div><div class="truncate"><a href="${item.pageUrl}" target="_blank" class="text-blue-600 underline text-[11px]">${item.pageUrl||'-'}</a></div></div>
        <div><div class="text-[10px] text-slate-500">메일발송</div><div class="${item.emailSent?'text-emerald-600':'text-red-500'} font-bold">${item.emailSent?'✅ 성공':'❌ 실패: '+(item.emailError||'')}</div></div>
        <div><div class="text-[10px] text-slate-500">ID</div><div class="text-[10px]">${item.id}</div></div>
      </div>
    </div>

    <!-- 한전 연계 -->
    <div class="bg-white rounded-xl p-4 border border-amber-200">
      <h3 class="font-black mb-2 flex items-center gap-2"><i class="fa-solid fa-bolt text-amber-500"></i> 한전 계통 연계 정보 <span class="text-[10px] bg-amber-100 px-2 py-0.5 rounded">실시간</span></h3>
      <div class="flex gap-2 mb-3">
        <input id="kepco-addr" value="${item.address}" class="flex-1 h-9 border rounded-lg px-3 text-[12px]" placeholder="주소">
        <button onclick="fetchKepco()" class="h-9 px-4 bg-amber-500 text-white rounded-lg font-bold text-[12px]"><i class="fa-solid fa-search"></i> 용량조회</button>
      </div>
      <div id="kepco-result" class="bg-slate-50 rounded-lg p-3 text-[11px] border min-h-[60px]">주소 기반 ${guessMetro(item.address)} 지역으로 조회해보세요. 한전 분산전원 API가 해당 지역의 누적 태양광 용량, 변압기 여유 등을 반환합니다.</div>
    </div>

    <!-- 상태 파이프라인 -->
    <div class="bg-white rounded-xl p-4 border">
      <h3 class="font-black mb-3"><i class="fa-solid fa-list-check"></i> 상담 상태 파이프라인</h3>
      <div class="grid grid-cols-3 gap-1.5">
        ${['신규','연락완료','상담중','현장방문','견적발송','계약진행','완료','보류','취소'].map(s=>`<button onclick="updateStatus('${item.id}','${s}')" class="h-9 rounded-lg border font-bold text-[11px] ${item.status===s?'bg-[#0F4C81] text-white border-[#0F4C81]':'bg-white'}">${s}</button>`).join('')}
      </div>
      <div class="mt-3 text-[11px] text-slate-500">현재: <span class="font-black text-slate-900">${item.status}</span> / 마지막 업데이트: ${item.updatedAt||''}</div>
    </div>

    <!-- 상담일지 + 메모 3종 -->
    <div class="bg-white rounded-xl p-4 border">
      <h3 class="font-black mb-3"><i class="fa-solid fa-comments"></i> 상담일지 & 피드백 (편의성)</h3>
      <div class="flex gap-1 mb-3">
        <button onclick="switchTab('memo')" id="tab-memo" class="tab-active px-3 py-1.5 rounded-full text-[11px] font-bold border">일반메모</button>
        <button onclick="switchTab('kakao')" id="tab-kakao" class="px-3 py-1.5 rounded-full text-[11px] font-bold border">카톡상담</button>
        <button onclick="switchTab('email')" id="tab-email" class="px-3 py-1.5 rounded-full text-[11px] font-bold border">이메일피드백</button>
        <button onclick="switchTab('log')" id="tab-log" class="px-3 py-1.5 rounded-full text-[11px] font-bold border">상담로그추가</button>
      </div>
      <div id="panel-memo">
        <textarea id="input-memo" class="w-full h-28 border rounded-lg p-3 text-[12px]" placeholder="상담 내용, 현장 특이사항, 고객 니즈 등">${item.memo||''}</textarea>
        <button onclick="saveMemo('memo')" class="mt-2 w-full h-9 bg-slate-900 text-white rounded-lg font-bold">일반메모 저장</button>
      </div>
      <div id="panel-kakao" class="hidden">
        <textarea id="input-kakao" class="w-full h-28 border rounded-lg p-3 text-[12px] bg-yellow-50" placeholder="카톡 대화 요약">${item.kakaoMemo||''}</textarea>
        <button onclick="saveMemo('kakaoMemo')" class="mt-2 w-full h-9 bg-yellow-400 text-black rounded-lg font-bold">카톡메모 저장</button>
      </div>
      <div id="panel-email" class="hidden">
        <textarea id="input-email" class="w-full h-28 border rounded-lg p-3 text-[12px] bg-blue-50" placeholder="이메일 피드백, 견적서 발송 내역">${item.emailMemo||''}</textarea>
        <button onclick="saveMemo('emailMemo')" class="mt-2 w-full h-9 bg-blue-600 text-white rounded-lg font-bold">이메일메모 저장</button>
      </div>
      <div id="panel-log" class="hidden">
        <div class="grid grid-cols-3 gap-2 mb-2">
          <select id="log-type" class="h-9 border rounded-lg px-2 text-[12px]"><option>전화</option><option>카톡</option><option>현장방문</option><option>문자</option><option>이메일</option></select>
          <input id="log-manager" placeholder="담당자" class="h-9 border rounded-lg px-2 text-[12px]" value="관리자">
          <input id="log-content" placeholder="내용 (예: 부재중, 100평 확인)" class="col-span-3 h-9 border rounded-lg px-3 text-[12px]">
        </div>
        <button onclick="addConsultLog()" class="w-full h-9 bg-[#0F4C81] text-white rounded-lg font-bold">+ 상담로그 추가 (메모에 타임스탬프 기록)</button>
        <div class="mt-3 text-[11px] text-slate-400">로그는 일반메모에 [시간] [유형] 담당자: 내용 형식으로 누적됩니다.</div>
      </div>
    </div>

    <!-- 액션 -->
    <div class="flex gap-2 pb-10">
      <button onclick="deleteInquiry('${item.id}')" class="flex-1 h-10 border border-red-200 text-red-600 rounded-lg font-bold"><i class="fa-solid fa-trash"></i> 삭제</button>
      <button onclick="closeDetail()" class="flex-1 h-10 bg-slate-900 text-white rounded-lg font-bold">닫기</button>
    </div>
  `;
}
function closeDetail(){ document.getElementById('drawer-backdrop').classList.add('hidden'); document.getElementById('detail-drawer').classList.remove('open'); }
function switchTab(t){ ['memo','kakao','email','log'].forEach(k=>{ document.getElementById('panel-'+k).classList.add('hidden'); document.getElementById('tab-'+k).classList.remove('tab-active'); }); document.getElementById('panel-'+t).classList.remove('hidden'); document.getElementById('tab-'+t).classList.add('tab-active'); }
function copyText(txt){ navigator.clipboard.writeText(txt); alert('복사됨: '+txt); }
async function updateStatus(id,status){ const res=await fetch('/api/inquiries',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,status})}); if(res.ok){ const j=await res.json(); const idx=inquiries.findIndex(x=>x.id===id); if(idx>-1) inquiries[idx]=j.inquiry; render(); openDetail(id); } }
async function saveMemo(field){ const id=selectedId; const map={memo:'input-memo',kakaoMemo:'input-kakao',emailMemo:'input-email'}; const val=document.getElementById(map[field]).value; const body={id}; body[field]=val; const res=await fetch('/api/inquiries',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); if(res.ok){ alert('저장됨'); const j=await res.json(); const idx=inquiries.findIndex(x=>x.id===id); inquiries[idx]=j.inquiry; render(); } }
async function addConsultLog(){ const id=selectedId; const type=document.getElementById('log-type').value; const manager=document.getElementById('log-manager').value; const content=document.getElementById('log-content').value; if(!content) return alert('내용 입력'); const now=new Date().toLocaleString('ko-KR'); const line=`[${now}] [${type}] ${manager}: ${content}\n`; const cur=document.getElementById('input-memo').value||''; const newMemo=line+cur; const res=await fetch('/api/inquiries',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,memo:newMemo})}); if(res.ok){ const j=await res.json(); const idx=inquiries.findIndex(x=>x.id===id); inquiries[idx]=j.inquiry; document.getElementById('input-memo').value=newMemo; alert('로그 추가됨'); render(); } }
async function fetchKepco(){ 
  const addr=document.getElementById('kepco-addr').value; 
  const metroCd=guessMetro(addr); 
  const out=document.getElementById('kepco-result'); 
  out.innerHTML='<div class="text-amber-600"><i class="fa-solid fa-spinner fa-spin"></i> 한전 조회 중...</div>'; 
  try{ 
    const res=await fetch(`/api/kepco?metroCd=${metroCd}&addr=${encodeURIComponent(addr)}`); 
    const json=await res.json(); 
    if(json.fallback){
      const est=json.data.estimate;
      out.innerHTML=`
        <div class="font-black text-amber-600 mb-2"><i class="fa-solid fa-triangle-exclamation"></i> 키 유효 ✅ → 지역코드 재시도로 예상 정보</div>
        <div class="bg-white border rounded-lg p-3 space-y-2">
          <div><span class="text-[10px] text-slate-500">주소</span><div class="font-bold">${addr}</div></div>
          <div class="grid grid-cols-2 gap-2 text-[11px]">
            <div class="bg-amber-50 p-2 rounded"><div class="text-[10px]">권장용량</div><div class="font-bold">${est.권장용량}</div></div>
            <div class="bg-emerald-50 p-2 rounded"><div class="text-[10px]">월수익예상</div><div class="font-bold text-emerald-700">${est.월수익예상}</div></div>
          </div>
          <div class="text-[11px]"><span class="font-bold">변압기 여유:</span> ${est.변압기_여유}</div>
          <div class="text-[11px] bg-slate-50 p-2 rounded"><span class="font-bold">확인방법:</span> ${est.확인방법}</div>
          <div class="text-[10px] text-slate-500 mt-2">다음 액션:<br>${json.data.nextAction.join('<br>')}</div>
        </div>
        <div class="mt-2 flex gap-2">
          <a href="https://online.kepco.co.kr" target="_blank" class="text-[11px] bg-slate-900 text-white px-3 py-1.5 rounded-lg">한전 파워플래너 바로가기</a>
          <a href="tel:123" class="text-[11px] border px-3 py-1.5 rounded-lg">123 전화</a>
        </div>
        <div class="mt-2 text-[9px] text-slate-400">raw: ${json.error?.slice(0,120)||''}</div>
      `;
    } else if(json.success){ 
      out.innerHTML=`<div class="font-bold mb-2 text-emerald-600">✅ 지역코드 ${metroCd} (${addr}) 실시간 조회 성공</div><div class="max-h-[200px] overflow-auto whitespace-pre-wrap bg-white border rounded p-2 text-[11px]">${JSON.stringify(json.data, null, 2).slice(0,3000)}</div><div class="mt-2 text-[10px] text-slate-400">* 한전 API 기준 누적용량, 연계가능 여부 판단 참고용</div>`; 
    } else out.innerHTML='조회 실패: '+(json.error||''); 
  }catch(e){ out.innerHTML='오류: '+e.message; } 
}
async function deleteInquiry(id){ if(!confirm('정말 삭제?')) return; const res=await fetch('/api/inquiries?id='+id,{method:'DELETE'}); if(res.ok){ inquiries=inquiries.filter(x=>x.id!==id); closeDetail(); render(); } }
function exportCSV(){ const headers=['id','name','phone','address','pyeong','roofType','message','status','memo','kakaoMemo','emailMemo','emailSent','receivedAt','pageUrl']; const rows=inquiries.map(i=>headers.map(h=>`"${(i[h]||'').toString().replace(/"/g,'""')}"`).join(',')); const csv=[headers.join(','),...rows].join('\n'); const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='solarroof_'+new Date().toISOString().slice(0,10)+'.csv'; a.click(); }
</script>
