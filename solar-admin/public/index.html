0평은 공장 창고 지붕임대 120평~1500평과 같은 99kW 저압 기준으로 심사된다. 본 가이드는 변전소, 주변압기, DL 3단계 병목을 공장 창고 지붕임대, 태양광발전소, 지붕임대 수익, REC, SMP, RE100, ESG 관점에서 400자 이상씩 상세히 설명하고 프로세스, 양호 기준, 탈락율, FAQ 5개를 제공한다."}),a("h3",{className:"text-[16px] font-bold mt-8 mb-2",children:"1단계 변전소 - 154kV/22.9kV 100MW급, 12,500kW 의미 - 공장 창고 지붕임대 기준"}),h("p",{className:"text-[13px] leading-7 mb-3",children:["변전소는 154kV 고압을 22.9kV로 낮추어 배전하는 최상위 관문이다. 한전 변전소 한 개는 통상 100MW급 용량을 보유하며, 그 중 태양광 등 분산전원이 사용할 수 있는 잔여가 12,500kW라면 약 ",Math.round(126.26262626262626),"개 99kW 공장 창고 지붕임대 발전소를 동시에 수용할 수 있다는 의미이다. 변전소 잔여가 넉넉하면 1단계는 통과이지만, 변전소 자체가 포화이면 하위 주변압기, DL 잔여와 관계없이 전체가 불가된다. 변전소 용량은 계절별 부하와 기존 발전소 연계에 따라 매일 변동되며, 한전 파워플래너에서 실시간 확인이 필요하다. 공장 창고 지붕임대 표준 플랫폼 SOLARROOF.KR은 변전소 기준을 12,500kW 이상 양호, 8,000kW 이하 주의로 구분한다. 태양광발전소 사업자는 변전소 여유를 가장 먼저 체크해야 하며, 이는 REC, SMP 수익과 직결된다. RE100 기업이 밀집한 산단일수록 변전소 경쟁이 치열해 조기에 선점하는 것이 중요하다. 골프장 등 대형주차장도 공장 창고 지붕임대와 동일하게 변전소 12,500kW 여유가 필수이며, 주차장 500평 87.5kW도 변전소 잔여에서 동일하게 차감된다. 누수 보증, 원상복구, 위약금 등 계약 리스크보다 먼저 계통이 막히면 사업 자체가 무산되기 때문이다."]}),a("h3",{className:"text-[16px] font-bold mt-8 mb-2",children:"2단계 주변압기 - 75kVA 병목, 탈락 30%의 숨은 관문 - 공장 창고 지붕임대·골프장 등 대형주차장"}),a("p",{className:"text-[13px] leading-7 mb-3",children:"주변압기는 22.9kV를 380V/220V 저압으로 변환하는 동네 변압기이다. 주택가용 30kVA, 공장 밀집용 75kVA, 100kVA 등이 있으며, 태양광 99kW를 연계하려면 전용 주변압기 100kVA가 필요한 경우가 많다. 주변압기 잔여 3,200kW는 약 32개 99kW를 수용할 수 있는 수치이지만, 이미 다른 공장 창고 지붕임대 발전소가 물려 있으면 탈락율 30%가 발생한다. 주변압기 병목은 변전소보다 더 빈번하며, 특히 구도심 공단인 반월, 시화, 남동, 구미, 성서 산단에서 심각하다. 전용 주변압기를 신설하면 비용이 1500만원에서 2500만원까지 발생하지만, 통과율을 2.3배 높이는 효과가 있다. 태양광발전소 입지 선정 시 주변압기 위치를 지도에서 확인하고, 300m 이내에 75kVA 이상이 있는지 체크해야 한다. 공장 창고 지붕임대 수익 계산 시 주변압기 신설 비용을 NPV에 반영해야 정확한 사업성을 알 수 있다. RE100, ESG, REC, SMP와 함께 주변압기는 계통용량 3단계 중 가장 비용이 수반되는 구간이다. 골프장 등 대형주차장도 공장 창고 지붕임대와 동일하게 주변압기 100kVA 신설이 필요하며, 주차장 캐노피 구조물은 바람 하중으로 인해 주변압기 신설 시 내진 검토가 추가된다."}),a("h3",{className:"text-[16px] font-bold mt-8 mb-2",children:"3단계 DL - 배전선로 마지막 1km, 탈락 80%의 최종 관문 - 공장 창고 지붕임대·골프장 등 대형주차장 임계 5.9%"}),a("p",{className:"text-[13px] leading-7 mb-3",children:"DL(Distribution Line)은 변전소에서 주변압기까지 22.9kV를 실어 나르는 배전선로이며, 마지막 1km 구간이 공장 창고 지붕임대 사업의 최종 병목이다. DL 잔여 850kW 5.9%는 간신히 통과 임계값으로, 5% 이하이면 한전 기준상 연계 불가 판정이 난다. DL은 전선 굵기, 길이, 분기 수에 따라 용량이 결정되며, 850kW는 99kW 8개 정도만 수용 가능하다. DL 포화는 평택시, 화성시 장안면, 안산시 반월, 시흥시 시화 등 서부 산단에서 80% 탈락율로 나타난다. DL 5.9%는 4857평 규모 공장 하나를 간신히 수용할 수 있는 수준이며, 1.2%와 같은 낮은 수치는 완전 불가이다. DL을 피하는 방법은 저압 분산 99kW를 100kW 이상 고압으로 전환하거나, 인접 DL로 우회하는 것이다. 태양광발전소 사업자는 DL 5.9% 같은 임계치에서 사업성을 재검토해야 하며, 공장 창고 지붕임대 수익 40,000원/kW·년 기준으로도 DL 탈락 시 수익이 0원이 된다. 골프장 등 대형주차장도 DL 850kW 5.9% 임계값을 동일하게 적용받으며, 주차장 100평~1000평은 공장 창고 지붕임대 120평~1500평과 같은 1km 병목에서 갈린다. 계통용량 확인 탭에서 DL 850kW 5.9%를 정확히 파악하고, 전용 주변압기 설치와 함께 DL 증설을 한전에 요청하는 것이 최선이다."}),a("h3",{className:"text-[16px] font-bold mt-8 mb-2",children:"계통용량 조회 프로세스 - 3단계 동시 통과 전략 - 공장 창고 지붕임대·골프장 등 대형주차장"}),a("p",{className:"text-[13px] leading-7 mb-3",children:"공장 창고 지붕임대 계통용량 조회 프로세스는 1) 주소 입력, 2) 한전 파워플래너 변전소 조회, 3) 주변압기 75kVA 확인, 4) DL 1km 잔여 확인, 5) 99kW 저압 분산 신청 순서이다. 변전소 12,500kW, 주변압기 3,200kW, DL 850kW 5.9% 세 조건이 동시에 만족해야 최종 가능 판정이 난다. SOLARROOF.KR은 이 프로세스를 800ms 간격 3단계 프로그레스로 시뮬레이션하며, 실제 한전 조회와 동일한 로직을 제공한다. 2026년 기준 계통용량 조회는 무료이며, 결과는 2시간 내 통보된다. 공장 창고 지붕임대, 태양광발전소, 지붕임대 수익, 계통용량, DL, 변전소, 주변압기, REC, SMP, RE100, ESG, 누수 보증, 원상복구, 위약금, NPV 키워드를 모두 고려한 종합 판정이 필요하다. 골프장 등 대형주차장도 공장 창고 지붕임대와 동일하게 3단계 프로세스를 거치며, 주차장 캐노피는 구조물 안전진단이 추가된다. 사업자 신청 시 40k 표준 준수 가점을 부여하여 A사 프리미엄 자재와 같은 안정적 시공사를 우선 매칭한다."}),a("div",{className:"overflow-x-auto my-6",children:h("table",{className:"w-full text-[12px] border",children:[a("thead",{className:"bg-[#0f1c2e] text-white",children:h("tr",{children:[a("th",{className:"p-2",children:"구분"}),a("th",{className:"p-2",children:"양호 기준"}),a("th",{className:"p-2",children:"주의 기준"}),a("th",{className:"p-2",children:"탈락율"}),a("th",{className:"p-2",children:"비고"})]})}),h("tbody",{children:[h("tr",{className:"border-t",children:[a("td",{className:"p-2 font-bold",children:"변전소"}),a("td",{className:"p-2",children:"12,500kW 이상"
